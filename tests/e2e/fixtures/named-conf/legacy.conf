// Legacy master/slave/masters keywords, which `hornet convert` modernises.

options {
    directory "/var/cache/bind";
};

zone "example.com" {
    type master;
    file "/etc/bind/zones/example.com.db";
};

zone "example.org" {
    type slave;
    masters { 192.0.2.1; };
    file "/var/cache/bind/example.org.db";
};
