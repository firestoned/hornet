// Top-level zones with options, acl, key, controls and logging.

options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { trusted; };
    forwarders {
        192.0.2.53;
        192.0.2.54;
    };
    forward only;
    dnssec-validation auto;
    listen-on port 53 { 127.0.0.1; };
    listen-on-v6 { ::1; };
};

acl "trusted" {
    192.168.0.0/24;
    10.0.0.0/8;
    localhost;
};

key "rndc-key" {
    algorithm hmac-sha256;
    secret "c2VjcmV0LXNlY3JldC1zZWNyZXQtc2VjcmV0LXNlY3JldA==";
};

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

logging {
    channel default_log {
        file "/var/log/named/default.log" versions 5 size 20m;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { default_log; };
    category lame-servers { null; };
};

zone "example.com" {
    type primary;
    file "/etc/bind/zones/example.com.db";
    allow-transfer { 192.168.0.2; key "rndc-key"; };
    notify yes;
};

zone "1.168.192.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/rev.192.168.1.db";
};

zone "example.net" {
    type secondary;
    primaries { 192.0.2.1; };
    file "/var/cache/bind/example.net.db";
};

zone "forward.example" {
    type forward;
    forward only;
    forwarders { 192.0.2.10; };
};
