#
# dnssec-policy grammar that BIND 9.20 added (ADR-0004): key-store,
# tag-range, cdnskey, cds-digest-types, inline-signing, manual-mode,
# offline-ksk and signatures-jitter.

options {
    directory "/var/cache/bind";
};

key-store "local" {
    directory "/var/cache/bind";
};

dnssec-policy "modern" {
    keys {
        ksk key-store "local" lifetime unlimited algorithm 13 tag-range 0 32767;
        zsk lifetime P90D algorithm 13 tag-range 32768 65535;
    };
    cdnskey no;
    cds-digest-types { 2; "sha-384"; };
    inline-signing yes;
    manual-mode no;
    offline-ksk no;
    signatures-jitter 12h;
    signatures-refresh 5d;
    signatures-validity 14d;
    signatures-validity-dnskey 14d;
};

dnssec-policy "rsa" {
    keys {
        csk lifetime P1Y algorithm 8 tag-range 0 100 2048;
    };
    nsec3param iterations 0 optout no salt-length 8;
};

zone "modern.example" {
    type primary;
    file "/var/cache/bind/modern.example.db";
    dnssec-policy "modern";
};

zone "rsa.example" {
    type primary;
    file "/var/cache/bind/rsa.example.db";
    inline-signing yes;
    dnssec-policy "rsa";
};
