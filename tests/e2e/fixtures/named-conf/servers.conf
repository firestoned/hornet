//
// Named primaries lists, server statements, stub/hint/secondary zones, a
// statement hornet does not model (statistics-channels) and options that
// exercise address-match-list negation and port forms.

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    recursion no;
    allow-query { !192.0.2.66; any; };
    allow-transfer { none; };
    also-notify { 192.0.2.20; 192.0.2.21; };
    notify explicit;
    listen-on port 5353 { 127.0.0.1; 192.0.2.1; };
    listen-on-v6 port 5353 { none; };
    max-cache-size 64m;
    version "not disclosed";
};

key "xfr-key" {
    algorithm hmac-sha256;
    secret "eGZyLWtleS14ZnIta2V5LXhmci1rZXkteGZyLWtleQ==";
};

primaries "upstream" {
    192.0.2.1;
    192.0.2.2;
};

server 192.0.2.1 {
    keys { "xfr-key"; };
};

server 192.0.2.2 {
    bogus no;
    transfers 4;
};

statistics-channels {
    inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
};

zone "." {
    type hint;
    file "/usr/share/dns/root.hints";
};

zone "secondary.example" {
    type secondary;
    primaries { upstream; };
    file "/var/cache/bind/secondary.example.db";
    allow-query { any; };
};

zone "stub.example" {
    type stub;
    primaries { 192.0.2.3; };
    file "/var/cache/bind/stub.example.db";
};

zone "notify.example" {
    type primary;
    file "/etc/bind/zones/notify.example.db";
    notify yes;
    also-notify { 192.0.2.30; };
    allow-update { key "xfr-key"; };
};
