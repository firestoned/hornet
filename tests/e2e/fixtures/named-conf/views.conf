// Split-horizon: every zone lives inside a view.

acl "internal-nets" {
    192.168.0.0/16;
    10.0.0.0/8;
};

key "transfer-key" {
    algorithm hmac-sha512;
    secret "dHJhbnNmZXIta2V5LXRyYW5zZmVyLWtleS10cmFuc2Zlci1rZXk=";
};

options {
    directory "/var/cache/bind";
    recursion no;
};

view "internal" {
    match-clients { internal-nets; };
    recursion yes;
    zone "example.com" {
        type primary;
        file "/etc/bind/internal/example.com.db";
        allow-transfer { key "transfer-key"; };
    };
};

view "external" {
    match-clients { any; };
    recursion no;
    zone "example.com" {
        type primary;
        file "/etc/bind/external/example.com.db";
    };
};
