//
// What bindy renders (ADR-0004): dnssec-policy with and without nsec3param,
// unlimited and finite key lifetimes, every duration spelling, global
// allow-new-zones / key-directory / dnssec-policy, and every print-time value.
// Valid on BIND 9.18 and 9.20.

options {
    directory "/var/cache/bind";
    allow-new-zones yes;
    key-directory "/var/cache/bind";
    dnssec-policy "bindy";
    recursion no;
};

dnssec-policy "bindy" {
    keys {
        ksk lifetime 365d algorithm ECDSAP256SHA256;
        zsk lifetime 90d algorithm ECDSAP256SHA256;
    };
    nsec3param iterations 0 optout no salt-length 0;
    signatures-refresh 5d;
    signatures-validity 30d;
    signatures-validity-dnskey 30d;
    zone-propagation-delay 300;
    parent-propagation-delay 3600;
    max-zone-ttl 86400;
};

dnssec-policy "nsec-unlimited" {
    keys {
        csk key-directory lifetime unlimited algorithm 13;
    };
    dnskey-ttl PT1H;
    parent-ds-ttl 1d;
    publish-safety 1h;
    retire-safety 1w2d;
    purge-keys P90D;
    signatures-refresh P5D;
    signatures-validity 2W;
    signatures-validity-dnskey 2W;
    zone-propagation-delay PT5M;
};

dnssec-policy multi {
    keys {
        ksk lifetime P1Y algorithm rsasha256 2048;
        zsk lifetime unlimited algorithm RSASHA256 1024;
        csk lifetime unlimited algorithm ed25519;
    };
    nsec3param;
};

dnssec-policy "optout" {
    keys {
        csk lifetime unlimited algorithm ecdsa384;
    };
    nsec3param optout yes;
};

zone "signed.example" {
    type primary;
    file "/var/cache/bind/signed.example.db";
    inline-signing yes;
};

zone "nsec.example" {
    type primary;
    file "/var/cache/bind/nsec.example.db";
    inline-signing yes;
    dnssec-policy "nsec-unlimited";
};

zone "multi.example" {
    type primary;
    file "/var/cache/bind/multi.example.db";
    inline-signing yes;
    dnssec-policy "multi";
};

zone "unsigned.example" {
    type primary;
    file "/var/cache/bind/unsigned.example.db";
    dnssec-policy "none";
};

logging {
    channel "default_stderr" {
        stderr;
        severity info;
        print-time iso8601;
        print-category yes;
        print-severity yes;
    };
    channel "utc" {
        stderr;
        print-time iso8601-utc;
    };
    channel "local" {
        stderr;
        print-time local;
    };
    channel "plain" {
        stderr;
        print-time yes;
    };
    channel "untimed" {
        stderr;
        print-time no;
    };
    category "default" { "default_stderr"; };
    category "dnssec" { "utc"; "local"; };
    category "general" { "plain"; "untimed"; };
};
