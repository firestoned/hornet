[package]
name         = "hornet-bind9"
version      = "0.2.0"
edition      = "2021"
rust-version = "1.74"
license      = "Apache-2.0"
repository   = "https://github.com/firestoned/hornet"
homepage     = "https://github.com/firestoned/hornet"
description  = "Parse, write, and validate BIND9 named.conf configuration files and DNS zone files"
keywords     = ["dns", "bind9", "parser", "named-conf", "zone-file"]
categories   = ["parser-implementations", "command-line-utilities"]
authors      = ["Erick Bourgeois <erick@firestoned.io>"]

[lib]
name = "hornet_bind9"
path = "src/lib.rs"

[[bin]]
name             = "hornet"
path             = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# `miette/fancy` (graphical diagnostics) only for the CLI: library consumers do
# not compile the terminal rendering stack (ADR-0004).
cli     = ["dep:clap", "miette/fancy"]
serde   = ["dep:serde"]

[dependencies]
winnow    = "0.6"
thiserror = "1"
miette    = "7"
clap      = { version = "=4.4.18", features = ["derive", "color"], optional = true }
serde     = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"
tempfile   = "3"

[[bench]]
name    = "named_conf"
harness = false

[[bench]]
name    = "zone_file"
harness = false

[[bench]]
name    = "named_conf_stress"
harness = false
