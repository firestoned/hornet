#
# Codecov configuration (ADR-0002).
#
# Three flags, one per suite, uploaded by different workflows:
#   unit         build.yaml, `make coverage-unit`
#   integration  build.yaml, `make coverage-integration`
#   e2e          e2e.yaml,   `make coverage-e2e-report` (instrumented CLI vs BIND9)
#
# Carryforward keeps a flag's last value when a commit does not run its suite
# (e2e.yaml is path-filtered). The binding 100% gate is `make coverage` in CI;
# the Codecov statuses mirror it for unit + integration and are informational
# for e2e, which cannot reach error paths by design.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default: false
      unit-and-integration:
        target: 100%
        threshold: 0%
        flags:
          - unit
          - integration
      e2e:
        informational: true
        flags:
          - e2e
    patch:
      default:
        target: 100%
        flags:
          - unit
          - integration

flags:
  unit:
    paths:
      - src/
    carryforward: true
  integration:
    paths:
      - src/
    carryforward: true
  e2e:
    paths:
      - src/
    carryforward: true

ignore:
  - "src/**/*_tests.rs"
  - "tests/**"
  - "benches/**"

comment:
  layout: "header, diff, flags, files"
  show_carryforward_flags: true
  require_changes: false
