#
# Reusable end-to-end test workflow: hornet round-tripped against real BIND9.
#
# Unit and integration tests can only check hornet against hornet. This gate
# uses BIND9 itself as the oracle: for every fixture in tests/e2e/fixtures/,
# named-checkconf / named-checkzone must accept both the fixture and hornet's
# rewritten output, BIND's canonical print of the two must match, and a second
# hornet pass must not change anything. See tests/e2e/run.sh for the exact
# checks and tests/e2e/known-failures.txt for open bugs it has found.
#
# The hornet CLI is compiled ONCE in the `build` job and handed to every suite
# job as an artifact; each suite job tests it against one BIND9 release line
# using the ISC image (docker.io/internetsystemsconsortium/bind9:<version>).
#
# Coverage (ADR-0002): the build job also compiles a coverage-instrumented
# hornet; after its gate run, each suite leg runs the suite again with that
# binary and uploads the raw profiles. The `coverage` job merges them into one
# report for the job summary, an HTML artifact (coverage-e2e) and Codecov
# (flag e2e). E2E coverage is reported, never gated: the gate is the round-trip
# result above, judged on the release binary.
#
# Each job maps 1:1 to a Makefile target (workflows delegate logic to the
# Makefile per repo convention). `make e2e` runs every version serially for
# local use.
#
# Callable via `workflow_call` (e.g. from dependabot-auto-merge.yaml) or run
# manually via `workflow_dispatch`.

name: E2E Tests

on:
  pull_request:
    paths:
      - '.github/workflows/e2e.yaml'
      - 'Makefile'
      - 'Cargo.toml'
      - 'src/parser/**'
      - 'src/writer/**'
      - 'src/ast/**'
      - 'src/main.rs'
      - 'tests/e2e/**'
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build hornet CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust build environment
        uses: firestoned/github-actions/rust/setup-rust-build@d0d51c638a90bffc2a1567fe7af112b37fe8854c # v1.3.7
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build the release binary
        run: make build-release

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-hornet
          path: target/release/hornet
          retention-days: 1
          if-no-files-found: error

      - name: Build the coverage-instrumented binary
        run: make coverage-e2e-build

      - name: Upload the instrumented binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-hornet-instrumented
          path: target/coverage/e2e/bin/hornet
          retention-days: 1
          if-no-files-found: error

  suite:
    name: BIND ${{ matrix.bind_version }} round-trip
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One BIND line breaking should not hide the state of the other.
      fail-fast: false
      matrix:
        bind_version: ['9.18', '9.20']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-hornet
          path: dist

      - name: Run the round-trip suite
        run: make e2e-run BIND_VERSION=${{ matrix.bind_version }} HORNET_BIN=dist/hornet

      # Coverage runs even when the gate run failed: a red suite is exactly
      # when the report is most useful. It never changes the leg's result.
      - name: Download the instrumented binary
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-hornet-instrumented
          path: target/coverage/e2e/bin

      - name: Collect coverage profiles
        if: ${{ !cancelled() }}
        run: make coverage-e2e-run BIND_VERSION=${{ matrix.bind_version }}

      - name: Upload coverage profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-profraw-${{ matrix.bind_version }}
          path: target/coverage/e2e/profraw/
          retention-days: 1
          if-no-files-found: warn

  coverage:
    name: E2E coverage report
    needs: suite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # llvm-profdata / llvm-cov must come from the same toolchain release
      # that instrumented the binary in the build job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Download the instrumented binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-hornet-instrumented
          path: target/coverage/e2e/bin

      - name: Download coverage profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-profraw-*
          path: target/coverage/e2e/profraw
          merge-multiple: true

      - name: Merge profiles into a report
        run: make coverage-e2e-report

      - name: E2E coverage summary
        run: make coverage-summary COVERAGE_JSON=target/coverage/e2e/coverage.json COVERAGE_TITLE="E2E coverage (hornet CLI against BIND9, not gated)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload e2e coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-e2e
          path: target/coverage/e2e/html/
          retention-days: 7

  # Single required check for branch protection and for callers of this
  # workflow: green only when every suite is green.
  e2e:
    name: E2E gate
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check suite results
        env:
          RESULT: ${{ needs.suite.result }}
        run: |
          echo "Suite matrix result: $RESULT"
          [ "$RESULT" = "success" ] || exit 1
